<!DOCTYPE html>
<html lang="it">
<head>
    <!-- ================================================== -->
    <!-- PARTE 1: HEAD, META, CSS E CONFIGURAZIONE FIREBASE -->
    <!-- ================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.O.E. - Rieti 210 | Protezione Civile</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Configurazione PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d3b66">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NOE Rieti">
    <link rel="apple-touch-icon" href="logo bianco.png">
    <style>
        :root { --pc-blue: #0d3b66; --pc-yellow: #f4d35e; --pc-accent: #e63946; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 45px; }
        .bg-pc-header { background: linear-gradient(135deg, var(--pc-blue) 0%, #1d4e89 100%); color: white; z-index: 1030; }
        .sticky-menu-bar { position: sticky; top: 56px; z-index: 1020; background-color: #f8f9fa; padding-top: 10px; padding-bottom: 10px; }
        .fixed-menu-container { display: flex; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; gap: 5px; }
        .fixed-menu-container .nav-item { flex: 0 0 auto; }
        .btn-pc { background-color: var(--pc-blue); color: white; }
        .btn-pc:hover { background-color: #082642; color: white; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .avatar-lg { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; }
        .vehicle-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
        .hydrant-img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
        .receipt-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .badge-role { background-color: var(--pc-yellow); color: #333; font-weight: bold; }
        .logo-noe-header { height: 45px; width: auto; margin-right: 12px; }
        .logo-noe-main { height: 140px; width: auto; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; }
        .nav-pills .nav-link { cursor: pointer; color: var(--pc-blue); font-weight: 500; }
        .nav-pills .nav-link.active { background-color: var(--pc-blue) !important; color: white !important; }
        @media (max-width: 768px) {
            .navbar .container-fluid { flex-direction: column; gap: 6px; }
            #userInfo { width: 100%; justify-content: center; flex-wrap: wrap; gap: 3px !important; }
            #userInfo .btn { font-size: 0.75rem !important; padding: 3px 6px !important; }
        }
        .online-bar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--pc-blue); color: white; font-size: 0.85rem; padding: 6px 15px; z-index: 1040; box-shadow: 0 -2px 8px rgba(0,0,0,0.2); }
        .online-indicator { width: 9px; height: 9px; background-color: #2ecc71; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 6px #2ecc71; }
    </style>
</head>
<body>
    <nav class="navbar bg-pc-header sticky-top shadow-sm py-2">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1 d-flex align-items-center text-white">
                <img src="logo bianco.png" alt="Logo" class="logo-noe-header" onerror="this.style.display='none'">
                <div>
                    <span style="font-size: 1rem; font-weight: bold;">N.O.E. - Rieti (Cod. 210)</span>
                    <div style="font-size: 0.7rem; opacity: 0.9;" class="fw-normal">C.F. 90041090573 &bull; H24: 3793954151</div>
                </div>
            </span>
            <div id="userInfo" class="d-none align-items-center gap-1 flex-wrap justify-content-end">
                <div id="archiveBtnContainer"></div>
                <div id="creatorReportBtnContainer" class="d-flex gap-1"></div>
                <span class="badge badge-role" id="userRoleBadge"></span>
                <button class="btn btn-outline-light btn-sm py-1 px-2" onclick="logout()">Esci</button>
            </div>
        </div>
    </nav>
    <div class="container my-4" id="appContainer"></div>
    <div id="onlineBar" class="online-bar d-none d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <div><span class="online-indicator"></span><span>Volontari online: <strong id="onlineCount">1</strong></span></div>
            <div class="border-start border-light opacity-50 ps-3" style="height: 15px;"></div>
            <div id="feedbackRatingContainer"><span id="feedbackRatingText" class="fw-bold text-warning"><i class="bi bi-star-fill me-1"></i> Valutazione PWA: -- / 5</span></div>
        </div>
        <div class="small opacity-75 d-none d-sm-block">N.O.E. Rieti 210 &bull; Sistema Cloud</div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3Nu_m2eCSPre7XBOJbGXs0s6dU_N1E4",
            authDomain: "noe-rieti-app.firebaseapp.com",
            projectId: "noe-rieti-app",
            storageBucket: "noe-rieti-app.appspot.com",
            messagingSenderId: "681497158437",
            appId: "1:681497158437:web:38b313c27c55c8afe7e00c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function getCachedData(collectionName, maxAgeMinutes = 30) {
            const cacheKey = 'noe_cache_' + collectionName;
            const timeKey = 'noe_time_' + collectionName;
            const cachedData = localStorage.getItem(cacheKey);
            const cachedTime = localStorage.getItem(timeKey);
            const now = new Date().getTime();
            if (cachedData && cachedTime && (now - cachedTime < maxAgeMinutes * 60 * 1000)) {
                return JSON.parse(cachedData);
            }
            const querySnapshot = await getDocs(collection(db, collectionName));
            const dataList = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            localStorage.setItem(cacheKey, JSON.stringify(dataList));
            localStorage.setItem(timeKey, now);
            return dataList;
        }

        function invalidateCache(collectionName) {
            localStorage.removeItem('noe_cache_' + collectionName);
            localStorage.removeItem('noe_time_' + collectionName);
        }
// --------------------------------------------------
        // PARTE 2: VARIABILI GLOBALI, UTILITY E CLOUD SYNC
        // --------------------------------------------------
        const ROLES_SINGLE = ["Presidente (Legale Rappresentante)", "Vice Presidente", "Segreteria", "Tesoriere", "Responsabile Mezzi", "Responsabile AIB", "Responsabile App"];
        const ROLES_MANAGERS = [...ROLES_SINGLE];
        const SERVICE_TYPES = ["Turno in Caserma", "Pattugliamento AIB", "Intervento AIB", "Pattugliamento Idrogeologico", "Intervento Idrogeologico", "Supporto alla Popolazione", "Manutenzione Caserma", "Manutenzione Mezzi"];
        const OPERATIVE_ROLES = ["Caposquadra", "Autista", "Operatore", "Soccorritore", "4° Uomo (Affiancamento)"];

        let users = [], loggedUser = JSON.parse(localStorage.getItem('noe_logged')) || null;
        let vehicles = [], shifts = [], historyShifts = [], availabilities = [], waterPoints = [], refuels = [], announcements = [], uploadedReports = [];
        let activeTab = 'bacheca';

        function isSuperAdmin() { return loggedUser && (loggedUser.ruolo === "Responsabile App" || loggedUser.ruolo === "Responsabile AIB"); }
        function isAppCreator() { return loggedUser && loggedUser.ruolo === "Responsabile App"; }
        function isManagerRole() { return loggedUser && ROLES_MANAGERS.includes(loggedUser.ruolo); }

        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        window.loadCloudData = async function() {
            try {
                users = await getCachedData('users', 30);
                vehicles = await getCachedData('vehicles', 30);
                waterPoints = await getCachedData('waterPoints', 30);
                announcements = await getCachedData('announcements', 30);
                refuels = await getCachedData('refuels', 30);

                const shiftSnap = await getDocs(collection(db, "shifts"));
                shifts = shiftSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                const histSnap = await getDocs(collection(db, "historyShifts"));
                historyShifts = histSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                const dispSnap = await getDocs(collection(db, "availabilities"));
                availabilities = dispSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                try {
                    const repSnap = await getDocs(collection(db, "uploadedReports"));
                    uploadedReports = repSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch(e) { uploadedReports = []; }

                applyCloudTheme();
                init();
            } catch (err) {
                console.error("Errore Firestore:", err);
            }
        };

        window.updatePresence = async function() {
            if (!loggedUser || !loggedUser.id) return;
            try { await updateDoc(doc(db, "users", loggedUser.id), { lastSeen: new Date().getTime() }); } catch (e) {}
        }

        window.renderOnlineCounter = async function() {
            const onlineBar = document.getElementById('onlineBar');
            if (!loggedUser) { if (onlineBar) onlineBar.classList.add('d-none'); return; }
            if (onlineBar) onlineBar.classList.remove('d-none');
            const fiveMins = new Date().getTime() - (5 * 60 * 1000);
            const count = users.filter(u => u.lastSeen && u.lastSeen > fiveMins).length;
            const countElem = document.getElementById('onlineCount');
            if (countElem) countElem.innerText = Math.max(1, count);
            try {
                const fbSnap = await getDocs(collection(db, "monthlyFeedbacks"));
                const fbs = fbSnap.docs.map(d => d.data());
                const ratingElem = document.getElementById('feedbackRatingText');
                if (ratingElem && fbs.length > 0) {
                    const sum = fbs.reduce((acc, f) => acc + (parseFloat(f.voto) || 0), 0);
                    ratingElem.innerHTML = `<i class="bi bi-star-fill me-1 text-warning"></i> Valutazione PWA: <strong>${(sum / fbs.length).toFixed(1)}</strong> / 5 ⭐ (${fbs.length})`;
                }
            } catch (e) {}
        }
// --------------------------------------------------
        // PARTE 3: TEMI, LOGIN, REGISTRAZIONE E INIT
        // --------------------------------------------------
        window.openThemeCustomizer = function() {
            if (!isAppCreator()) return;
            const cur = getComputedStyle(document.documentElement).getPropertyValue('--pc-blue').trim() || '#0d3b66';
            const nc = prompt("Colore esadecimale principale (es. #0d3b66):", cur);
            if (nc && nc.startsWith('#')) saveThemeToCloud(nc);
        }

        window.saveThemeToCloud = async function(colorHex) {
            try {
                const ref = doc(db, "appSettings", "themeConfig");
                await updateDoc(ref, { primaryColor: colorHex }).catch(async () => {
                    const { setDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                    await setDoc(ref, { primaryColor: colorHex });
                });
                applyThemeColor(colorHex);
                alert("Tema aggiornato!");
            } catch (err) { applyThemeColor(colorHex); }
        }

        window.applyThemeColor = function(colorHex) {
            document.documentElement.style.setProperty('--pc-blue', colorHex);
            localStorage.setItem('noe_theme_color', colorHex);
        }

        window.applyCloudTheme = async function() {
            try {
                const snap = await getDocs(collection(db, "appSettings"));
                const sd = snap.docs.find(d => d.id === "themeConfig");
                if (sd && sd.data().primaryColor) applyThemeColor(sd.data().primaryColor);
                else { const lc = localStorage.getItem('noe_theme_color'); if (lc) applyThemeColor(lc); }
            } catch (e) { const lc = localStorage.getItem('noe_theme_color'); if (lc) applyThemeColor(lc); }
        }

        window.init = async function() {
            if (!loggedUser) {
                renderLogin();
                const ob = document.getElementById('onlineBar');
                if (ob) ob.classList.add('d-none');
            } else {
                document.getElementById('userInfo').classList.remove('d-none');
                document.getElementById('userInfo').classList.add('d-flex');
                document.getElementById('userRoleBadge').innerText = loggedUser.ruolo;
                updatePresence();
                renderOnlineCounter();
                if (!window.presenceInterval) {
                    window.presenceInterval = setInterval(() => { updatePresence(); loadCloudData(); }, 60000);
                }
                const isBlocked = await checkMonthlyFeedback();
                if (isBlocked) return;

                document.getElementById('archiveBtnContainer').innerHTML = isManagerRole() ? `
                    <button class="btn btn-info btn-sm fw-bold text-white" onclick="switchTab('archivioReport')"><i class="bi bi-folder-symlink-fill me-1"></i> Archivio</button>
                ` : '';

                document.getElementById('creatorReportBtnContainer').innerHTML = isAppCreator() ? `
                    <button class="btn btn-warning btn-sm fw-bold text-dark" onclick="downloadWordReport()"><i class="bi bi-file-earmark-word-fill me-1"></i> Word</button>
                    <button class="btn btn-outline-danger btn-sm fw-bold" onclick="renderAdminFeedbackDashboard()"><i class="bi bi-eye-slash-fill me-1"></i> Feedback</button>
                    <button class="btn btn-outline-dark btn-sm fw-bold" onclick="openThemeCustomizer()"><i class="bi bi-palette-fill me-1"></i> Colori</button>
                ` : '';

                renderMainView();
            }
        }

        window.renderLogin = function() {
            document.getElementById('appContainer').innerHTML = `
                <div class="row justify-content-center"><div class="col-md-5"><div class="card p-4 text-center">
                    <img src="logo bianco.png" alt="Logo" class="logo-noe-main" onerror="this.style.display='none'">
                    <h3 class="mt-2 mb-1 text-primary fw-bold">N.O.E. - Rieti 210</h3>
                    <p class="text-muted mb-4">Nucleo Operativo Emergenza - Cloud</p>
                    <form onsubmit="handleLogin(event)">
                        <div class="mb-3 text-start"><label class="form-label">Email o Codice Fiscale</label><input type="text" id="loginId" class="form-control" required></div>
                        <div class="mb-3 text-start"><label class="form-label">Password</label><input type="password" id="loginPass" class="form-control" required></div>
                        <button type="submit" class="btn btn-pc w-100 mb-3 fw-bold">Accedi</button>
                    </form>
                    <hr><button class="btn btn-outline-secondary w-100" onclick="renderRegister()">Registrati</button>
                </div></div></div>
            `;
        }

        window.renderRegister = function() {
            let opts = `<option value="Volontario">Volontario</option>`;
            ROLES_SINGLE.forEach(r => {
                const taken = users.some(u => u.ruolo === r);
                opts += `<option value="${r}" ${taken ? 'disabled' : ''}>${r} ${taken ? '(Occupato)' : ''}</option>`;
            });
            document.getElementById('appContainer').innerHTML = `
                <div class="row justify-content-center"><div class="col-md-7"><div class="card p-4">
                    <h4 class="mb-3 text-primary fw-bold text-center">Registrazione Volontario</h4>
                    <form onsubmit="handleRegister(event)">
                        <div class="mb-3"><label class="form-label">Foto Profilo*</label><input type="file" id="regFoto" accept="image/*" class="form-control" required></div>
                        <div class="row"><div class="col-md-6 mb-3"><label>Nome*</label><input type="text" id="regNome" class="form-control" required></div><div class="col-md-6 mb-3"><label>Cognome*</label><input type="text" id="regCognome" class="form-control" required></div></div>
                        <div class="mb-3"><label>Ruolo*</label><select id="regRuolo" class="form-select" required>${opts}</select></div>
                        <div class="row"><div class="col-md-6 mb-3"><label>Tel*</label><input type="tel" id="regTel" class="form-control" required></div><div class="col-md-6 mb-3"><label>Email*</label><input type="email" id="regEmail" class="form-control" required></div></div>
                        <div class="row"><div class="col-md-6 mb-3"><label>Codice Fiscale*</label><input type="text" id="regCF" class="form-control" required></div><div class="col-md-3 mb-3"><label>Sangue</label><input type="text" id="regSangue" class="form-control"></div><div class="col-md-3 mb-3"><label>Taglia</label><input type="text" id="regTaglia" class="form-control"></div></div>
                        <div class="mb-3"><label>Password*</label><input type="password" id="regPass" class="form-control" required></div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">Completa Registrazione</button>
                        <button type="button" class="btn btn-link w-100 mt-2" onclick="renderLogin()">Torna al Login</button>
                    </form>
                </div></div></div>
            `;
        }
// --------------------------------------------------
        // PARTE 4: REGISTRAZIONE, LOGIN E BACHECA (CACHE PULITA)
        // --------------------------------------------------
        window.handleRegister = async function(e) {
            e.preventDefault();
            const f = document.getElementById('regFoto').files[0];
            if (!f) return;
            try {
                const foto = await compressImage(f, 500, 0.7);
                await addDoc(collection(db, "users"), {
                    nome: document.getElementById('regNome').value, cognome: document.getElementById('regCognome').value,
                    ruolo: document.getElementById('regRuolo').value, tel: document.getElementById('regTel').value,
                    email: document.getElementById('regEmail').value, cf: document.getElementById('regCF').value,
                    sangue: document.getElementById('regSangue').value, taglia: document.getElementById('regTaglia').value,
                    corsi: "", pass: document.getElementById('regPass').value, foto: foto
                });
                invalidateCache('users');
                alert('Registrazione completata!');
                loadCloudData();
            } catch (err) {}
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            const id = document.getElementById('loginId').value.trim().toLowerCase();
            const pass = document.getElementById('loginPass').value;
            const found = users.find(u => (u.email.toLowerCase() === id || u.cf.toLowerCase() === id) && u.pass === pass);
            if (found) { loggedUser = found; localStorage.setItem('noe_logged', JSON.stringify(loggedUser)); init(); }
            else { alert('Credenziali non valide!'); }
        }

        window.logout = function() {
            if (window.presenceInterval) { clearInterval(window.presenceInterval); window.presenceInterval = null; }
            localStorage.removeItem('noe_logged'); loggedUser = null;
            document.getElementById('userInfo').classList.add('d-none');
            const ob = document.getElementById('onlineBar'); if (ob) ob.classList.add('d-none');
            renderLogin();
        }

        window.switchTab = function(tab) { activeTab = tab; if (tab === 'bacheca') markAllAnnouncementsAsRead(); renderMainView(); }

        window.markAllAnnouncementsAsRead = async function() {
            const userName = `${loggedUser.nome} ${loggedUser.cognome}`;
            for (let ann of announcements) {
                let letti = ann.lettiDa || [];
                if (!letti.some(l => l.nome === userName)) {
                    try {
                        await updateDoc(doc(db, "announcements", ann.id), { lettiDa: arrayUnion({ nome: userName, dataOra: new Date().toLocaleString('it-IT') }) });
                        invalidateCache('announcements');
                    } catch (err) {}
                }
            }
        }
// --------------------------------------------------
        // PARTE 5: RENDER PRINCIPALE E ANAGRAFICA VOLONTARI
        // --------------------------------------------------
        window.renderMainView = function() {
            const userName = `${loggedUser.nome} ${loggedUser.cognome}`;
            let unreadCount = announcements.filter(ann => !(ann.lettiDa || []).some(l => l.nome === userName)).length;
            let bachecaBadge = unreadCount > 0 ? `<span class="badge bg-danger ms-1 rounded-pill">${unreadCount}</span>` : '';

            document.getElementById('appContainer').innerHTML = `
                <div class="row text-center mb-2"><div class="col-md-12"><h2 class="fw-bold mb-1">Benvenuto, ${loggedUser.nome} ${loggedUser.cognome}</h2><p class="text-muted">Ruolo Attivo: <strong>${loggedUser.ruolo}</strong></p></div></div>
                <div class="sticky-menu-bar shadow-sm rounded mb-4">
                    <ul class="nav nav-pills fixed-menu-container bg-white p-2 rounded border">
                        <li class="nav-item"><a class="nav-link ${activeTab === 'bacheca' ? 'active' : ''}" onclick="switchTab('bacheca')"><i class="bi bi-megaphone-fill me-1"></i> Bacheca ${bachecaBadge}</a></li>
                        <li class="nav-item"><a class="nav-link ${activeTab === 'anagrafica' ? 'active' : ''}" onclick="switchTab('anagrafica')"><i class="bi bi-people-fill me-1"></i> Volontari</a></li>
                        <li class="nav-item"><a class="nav-link ${activeTab === 'turni' ? 'active' : ''}" onclick="switchTab('turni')"><i class="bi bi-calendar-event me-1"></i> Turni</a></li>
                        <li class="nav-item"><a class="nav-link ${activeTab === 'disponibilita' ? 'active' : ''}" onclick="switchTab('disponibilita')"><i class="bi bi-calendar-check me-1"></i> Disponibilità</a></li>
                        <li class="nav-item"><a class="nav-link ${activeTab === 'storico' ? 'active' : ''}" onclick="switchTab('storico')"><i class="bi bi-clock-history me-1"></i> Storico</a></li>
                        <li class="nav-item"><a class="nav-link ${activeTab === 'mezzi' ? 'active' : ''}" onclick="switchTab('mezzi')"><i class="bi bi-truck me-1"></i> Mezzi</a></li>
                        <li class="nav-item"><a class="nav-link ${activeTab === 'rifornimenti' ? 'active' : ''}" onclick="switchTab('rifornimenti')"><i class="bi bi-fuel-pump me-1"></i> Rifornimenti</a></li>
                        <li class="nav-item"><a class="nav-link ${activeTab === 'luoghi' ? 'active' : ''}" onclick="switchTab('luoghi')"><i class="bi bi-geo-alt-fill me-1"></i> Punti GPS</a></li>
                    </ul>
                </div>
                <div id="tabContent"></div>
            `;
            if (activeTab === 'bacheca') { renderBacheca(); markAllAnnouncementsAsRead(); }
            else if (activeTab === 'anagrafica') renderAnagrafica();
            else if (activeTab === 'turni') renderTurni();
            else if (activeTab === 'disponibilita') renderDisponibilita();
            else if (activeTab === 'storico') renderStorico();
            else if (activeTab === 'mezzi') renderMezzi();
            else if (activeTab === 'rifornimenti') renderRifornimenti();
            else if (activeTab === 'luoghi') renderLuoghi();
            else if (activeTab === 'archivioReport') renderArchivioReport();
            renderOnlineCounter();
        }

        window.renderBacheca = function() {
            const canPost = isManagerRole(), isAdmin = isSuperAdmin();
            let annHTML = announcements.map(ann => `
                <div class="col-md-12 mb-3"><div class="card p-3 border-start border-4 border-warning shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-2"><h5 class="fw-bold text-primary mb-0">${ann.titolo}</h5><small class="text-muted">${ann.data}</small></div>
                    <p class="mb-2 text-dark" style="white-space: pre-line;">${ann.testo}</p>
                    <div class="d-flex justify-content-between align-items-center border-top pt-2 mt-2">
                        <small class="text-secondary">Autore: <strong>${ann.autore}</strong></small>

            e.preventDefault();
            let selectedVols = [];
            users.forEach((u, idx) => {
                const cb = document.getElementById(`vol_cb_${idx}`);
                if (cb && cb.checked) {
                    let rolesList = [];
                    OPERATIVE_ROLES.forEach(r => { if (document.getElementById(`role_${r}_${idx}`)?.checked) rolesList.push(r); });

                    selectedVols.push({ nome: `${u.nome} ${u.cognome}`, ruoloOperativo: rolesList.join(' + '), mansioniSpuntate: true });
                }
            });
            if (selectedVols.length === 0) { alert("Seleziona almeno un volontario"); return; }
            const mezzoId = document.getElementById('shiftMezzo').value;
            let mezzoStr = "Nessun Mezzo", vehicleObj = null;
            if (mezzoId !== "Nessun Mezzo") {
                vehicleObj = vehicles.find(v => v.id === mezzoId);
                if (vehicleObj) mezzoStr = `${vehicleObj.modello} (${vehicleObj.targa})`;
            }
            try {
                await addDoc(collection(db, "shifts"), {
                    tipoServizio: document.getElementById('shiftTipo').value, data: document.getElementById('shiftData').value,
                    oraInizio: document.getElementById('shiftOraInizio').value, oraFine: document.getElementById('shiftOraFine').value,

                });
                alert("Turno aperto!"); loadCloudData();
            } catch (err) {}
        }

            let kmPercorsi = 0, kmFinali = 0;
            if (shiftToClose.mezzoId && shiftToClose.mezzoId !== "Nessun Mezzo") {
                const currentVehicle = vehicles.find(v => v.id === shiftToClose.mezzoId);
                const kmAttuali = currentVehicle ? currentVehicle.km : (shiftToClose.kmInizialiMezzo || 0);
                const kmFinaliInput = prompt(`KM finali mezzo (Attuali: ${kmAttuali}):`, kmAttuali);
                if (kmFinaliInput !== null) {
                    kmFinali = parseInt(kmFinaliInput, 10) || kmAttuali;
                    kmPercorsi = kmFinali - kmAttuali;
                    if (currentVehicle) { await updateDoc(doc(db, "vehicles", currentVehicle.id), { km: kmFinali }); invalidateCache('vehicles'); }
                }
            } else { kmPercorsi = parseInt(prompt("KM percorsi:", "0"), 10) || 0; }

            try {
                await addDoc(collection(db, "historyShifts"), { ...shiftToClose, oraFine: oraFineReale, kmFinaliMezzo: kmFinali, kmPercorsi: kmPercorsi, dataChiusura: new Date().toLocaleDateString('it-IT') });

                            <div class="pt-2 border-top d-flex gap-2">

                                <button class="btn btn-sm btn-outline-danger w-50" onclick="deleteWaterPoint('${wp.id}')">Elimina</button>
                            </div>` : ''}
                    </div>
                </div></div>
            `).join('');

            document.getElementById('tabContent').innerHTML = `
                ${isAdmin ? `
                <div class="card p-4 mb-4 bg-light border">
                    <h4 class="fw-bold text-primary mb-3">Registra Nuovo Punto GPS (Idrante / Riserva / Luogo)</h4>
                    <form onsubmit="addWaterPoint(event)">
                        <div class="mb-3"><label>Foto*</label><input type="file" id="wpFoto" accept="image/*" class="form-control" required></div>
                        <div class="row"><div class="col-md-6 mb-3"><label>Nome / Identificativo*</label><input type="text" id="wpNome" class="form-control" required></div><div class="col-md-6 mb-3"><label>Tipologia*</label><select id="wpTipo" class="form-select"><option value="Idrante a Colonnina">Idrante a Colonnina</option><option value="Idrante Sottosuolo">Idrante Sottosuolo</option><option value="Vasca AIB">Vasca / Punto Attingimento</option><option value="Altro Luogo Operativo">Altro Luogo</option></select></div></div>
                        <div class="row"><div class="col-md-4 mb-3"><label>Latitudine*</label><input type="number" step="any" id="wpLat" class="form-control" required></div><div class="col-md-4 mb-3"><label>Longitudine*</label><input type="number" step="any" id="wpLng" class="form-control" required></div><div class="col-md-4 mb-3"><label>&nbsp;</label><button type="button" class="btn btn-outline-secondary w-100" onclick="getGPSCoordinates()">Rileva GPS</button></div></div>
                        <div class="mb-3"><label>Note / Pressione / Dettagli</label><input type="text" id="wpPortata" class="form-control" placeholder="es. Ottima pressione"></div>
                        <button type="submit" class="btn btn-primary fw-bold">Salva Punto GPS</button>
                    </form>
                </div>` : ''}
                <h4 class="fw-bold mb-3">Elenco Punti e Destinazioni GPS (${waterPoints.length})</h4>
                <div class="row">${wpHTML || '<div class="col-12 text-muted">Nessun punto GPS registrato.</div>'}</div>
            `;
        }

        window.getGPSCoordinates = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                    document.getElementById('wpLat').value = p.coords.latitude;
                    document.getElementById('wpLng').value = p.coords.longitude;
                    alert("Coordinate GPS acquisite!");
                });
            } else { alert("Geolocalizzazione non supportata."); }
        }

        window.addWaterPoint = async function(e) {
            e.preventDefault();
            const f = document.getElementById('wpFoto').files[0];
            if (!f) return;
            const foto = await compressImage(f, 800, 0.7);
            await addDoc(collection(db, "waterPoints"), {
                nome: document.getElementById('wpNome').value, tipo: document.getElementById('wpTipo').value,
                lat: parseFloat(document.getElementById('wpLat').value), lng: parseFloat(document.getElementById('wpLng').value),
                portata: document.getElementById('wpPortata').value, foto: foto
            });
            invalidateCache('waterPoints'); alert("Punto GPS salvato!"); loadCloudData();
        }

        window.editWaterPoint = async function(id) {
            const wp = waterPoints.find(item => item.id === id);
            if (!wp) return;
            const newNome = prompt("Modifica nome:", wp.nome);
            const newLat = prompt("Modifica Latitudine:", wp.lat);
            const newLng = prompt("Modifica Longitudine:", wp.lng);
            const newPortata = prompt("Modifica note/portata:", wp.portata || "");
            if (newNome !== null && newLat !== null && newLng !== null) {
                try {
                    await updateDoc(doc(db, "waterPoints", id), {
                        nome: newNome, lat: parseFloat(newLat) || wp.lat, lng: parseFloat(newLng) || wp.lng, portata: newPortata
                    });
                    invalidateCache('waterPoints'); alert("Punto aggiornato!"); loadCloudData();
                } catch (e) {}
            }
        }

        window.deleteWaterPoint = async function(id) { if (confirm("Eliminare punto GPS?")) { await deleteDoc(doc(db, "waterPoints", id)); invalidateCache('waterPoints'); loadCloudData(); } }

        window.renderArchivioReport = function() {
            if (!isManagerRole()) return;
            let html = uploadedReports.map(rep => `
                <div class="col-md-6 mb-3"><div class="card p-3 border-start border-4 border-info h-100">
                    <h5 class="fw-bold text-primary">${rep.titolo}</h5>
                    <p class="mb-1"><strong>Periodo:</strong> ${rep.periodo}</p>
                    <a href="${rep.fileUrl}" download="${rep.fileName}" class="btn btn-sm btn-pc fw-bold mt-2">Scarica (.doc)</a>
                </div></div>
            `).join('');
            document.getElementById('tabContent').innerHTML = `<button class="btn btn-outline-secondary btn-sm mb-3" onclick="switchTab('bacheca')">Indietro</button><h4>Archivio Report</h4><div class="row">${html || '<div class="col-12 text-muted">Nessun report.</div>'}</div>`;
        }
// --------------------------------------------------
        // PARTE 10: FEEDBACK, REPORT MILITARE E CHIUSURA SCRIPT
        // --------------------------------------------------
        window.checkMonthlyFeedback = async function() {
            if (!loggedUser || isManagerRole()) return false;
            const today = new Date();
            if (today.getDate() >= 15 && today.getDate() <= 20) {
                const cur = `${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;
                try {
                    const snap = await getDocs(collection(db, "monthlyFeedbacks"));
                    if (!snap.docs.some(d => d.data().userEmail === loggedUser.email && d.data().periodo === cur)) {
                        renderFeedbackModal(cur); return true;
                    }
                } catch (e) {}
            }
            return false;
        }

        window.renderFeedbackModal = function(periodo) {
            document.getElementById('appContainer').innerHTML = `
                <div class="row justify-content-center"><div class="col-md-7"><div class="card p-4 border-danger shadow-lg text-center">
                    <h3 class="fw-bold text-primary">Valutazione PWA Mensile</h3>
                    <form onsubmit="submitMonthlyFeedback(event, '${periodo}')">
                        <div class="mb-3 text-start"><label>Voto (1-5)*</label><select id="fbVoto" class="form-select"><option value="5">5 - Ottima</option><option value="3">3 - Sufficiente</option><option value="1">1 - Scarsa</option></select></div>
                        <div class="mb-3 text-start"><label>Cosa ti piace?*</label><textarea id="fbPiace" class="form-control" required></textarea></div>
                        <div class="mb-3 text-start"><label>Migliorie:*</label><textarea id="fbMigliorie" class="form-control" required></textarea></div>
                        <button type="submit" class="btn btn-pc w-100 fw-bold">Invia e sblocca app</button>
                    </form>
                </div></div></div>
            `;
        }

        window.submitMonthlyFeedback = async function(e, periodo) {
            e.preventDefault();
            await addDoc(collection(db, "monthlyFeedbacks"), { periodo: periodo, voto: document.getElementById('fbVoto').value, cosaPiace: document.getElementById('fbPiace').value, migliorie: document.getElementById('fbMigliorie').value, dataInvio: new Date().toLocaleString('it-IT'), userEmail: loggedUser.email, userName: `${loggedUser.nome} ${loggedUser.cognome}` });
            alert("Grazie! App sbloccata."); loadCloudData();
        }

        window.renderAdminFeedbackDashboard = async function() {
            if (!isAppCreator()) return;
            const snap = await getDocs(collection(db, "monthlyFeedbacks"));
            let html = snap.docs.map(d => { let f = d.data(); return `<div class="col-md-6 mb-3"><div class="card p-3"><h5>${f.userName} (${f.periodo})</h5><p>Voto: ${f.voto}</p><p>${f.migliorie}</p></div></div>`; }).join('');
            document.getElementById('appContainer').innerHTML = `<button class="btn btn-outline-secondary btn-sm mb-3" onclick="switchTab('bacheca')">Indietro</button><h4>Dashboard Feedback</h4><div class="row">${html}</div>`;
        }

        window.downloadWordReport = function() {
            const today = new Date();
            const defaultMonth = String(today.getMonth() + 1).padStart(2, '0') + '/' + today.getFullYear();
            const inputMonth = prompt("Inserisci Mese e Anno del report (MM/AAAA):", defaultMonth);
            if (!inputMonth) return;
            const [mStr, yStr] = inputMonth.split('/');
            const monthInt = parseInt(mStr, 10), yearInt = parseInt(yStr, 10);
            if (isNaN(monthInt) || isNaN(yearInt)) { alert("Data non valida!"); return; }

            let filteredShifts = historyShifts.filter(s => {
                if (!s.data) return false;
                const p = s.data.split('-');
                return p.length === 3 && parseInt(p[0], 10) === yearInt && parseInt(p[1], 10) === monthInt;
            });
            let filteredRefuels = refuels.filter(r => {
                if (!r.data) return false;
                const p = r.data.split('-');
                return p.length === 3 && parseInt(p[0], 10) === yearInt && parseInt(p[1], 10) === monthInt;
            });

            let totalKm = 0, totalFuelCost = 0;
            filteredShifts.forEach(s => totalKm += (parseInt(s.kmPercorsi, 10) || 0));
            filteredRefuels.forEach(r => totalFuelCost += (parseFloat(r.importo) || 0));

            let printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <meta charset="utf-8">
                    <title>STATO DI SERVIZIO - N.O.E. RIETI 210</title>
                    <style>
                        body { font-family: 'Courier New', Courier, monospace; font-size: 11pt; color: #111; margin: 2cm; background-color: #fff; }
                        .watermark { position: fixed; top: 35%; left: 20%; width: 60%; opacity: 0.08; z-index: -1; text-align: center; }
                        .watermark img { width: 100%; height: auto; }
                        .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
                        .header h2, .header h4 { margin: 2px; text-transform: uppercase; font-weight: bold; }
                        .section-title { font-weight: bold; text-transform: uppercase; border-bottom: 1px dashed #000; margin-top: 20px; margin-bottom: 10px; font-size: 12pt; }
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 10pt; }
                        th, td { border: 1px solid #000; padding: 6px; text-align: left; }
                        th { background-color: #eaeaea; text-transform: uppercase; }
                        .signatures { margin-top: 50px; width: 100%; }
                        .signatures td { border: none; text-align: center; width: 50%; padding-top: 40px; }
                    </style>
                </head>
                <body>
                    <div class="watermark"><img src="logo bianco.png" alt="Logo"></div>
                    <div class="header">
                        <h2>NUCLEO OPERATIVO EMERGENZA &bull; N.O.E. RIETI 210</h2>
                        <h4>STATO DI SERVIZIO E RIEPILOGO TATTICO MENSILE</h4>
                        <p style="font-size: 10pt; margin-top: 5px;">PERIODO DI RIFERIMENTO: <strong>${inputMonth}</strong> &bull; PROTOCOLLO INTERNO</p>
                    </div>

                    <div class="section-title">1. Riepilogo Operativo Generale</div>
                    <p><strong>- Totale Servizi/Turni Conclusi:</strong> ${filteredShifts.length}</p>
                    <p><strong>- Chilometraggio Totale Flotta:</strong> ${totalKm} KM</p>
                    <p><strong>- Rifornimenti Carburante:</strong> ${filteredRefuels.length} registrazioni (Spesa Totale: &euro; ${totalFuelCost.toFixed(2)})</p>

                    <div class="section-title">2. Registro Dettagliato Attività Svolte</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Tipologia Servizio</th>
                                <th>Mezzo</th>
                                <th>KM</th>
                                <th>Squadra & Note</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filteredShifts.length === 0 ? '<tr><td colspan="5" style="text-align:center;"><em>Nessuna attività registrata nel periodo.</em></td></tr>' :
                            filteredShifts.map(s => `
                                <tr>
                                    <td>${s.data} (${s.oraInizio}-${s.oraFine})</td>
                                    <td><strong>${s.tipoServizio}</strong></td>
                                    <td>${s.mezzoUsato || 'Nessuno'}</td>
                                    <td>${s.kmPercorsi || 0} km</td>
                                    <td>Squadra: ${(s.volontariDettaglio || []).map(v => v.nome).join(', ')}<br><em>Note: ${s.note || 'Nessuna'}</em></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <table class="signatures">
                        <tr>
                            <td>
                                <strong>Il Redattore del Reparto</strong><br>
                                Responsabile App / Gestionale Cloud<br><br><br>
                                ____________________________________
                            </td>
                            <td>
                                <strong>Il Legale Rappresentante</strong><br>
                                Il Presidente / Comandante di Nucleo<br><br><br>
                                ____________________________________
                            </td>
                        </tr>
                    </table>
                </body>
                </html>
            `);
            printWindow.document.close();
            setTimeout(() => { printWindow.print(); }, 500);
        };

        // Avvio applicazione
        loadCloudData();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
