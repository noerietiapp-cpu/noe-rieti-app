                <div>

                    <div style="font-size: 0.75rem; opacity: 0.9;" class="fw-normal">

    <!-- Leaflet JS per Mappa -->

    <!-- Firebase SDKs & Core Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3Nu_m2eCSPre7XBOJbGXs0s6dU_N1E4",
            authDomain: "noe-rieti-app.firebaseapp.com",
            projectId: "noe-rieti-app",
            storageBucket: "noe-rieti-app.appspot.com",
            messagingSenderId: "681497158437",
            appId: "1:681497158437:web:38b313c27c55c8afe7e00c"
        };

        const app = initializeApp(firebaseConfig);

        const ROLES_SINGLE = [

        const SERVICE_TYPES = [

            "Intervento AIB",
            "Pattugliamento Idrogeologico",
            "Intervento Idrogeologico",
            "Supporto alla Popolazione",
            "Manutenzione Caserma",

        const OPERATIVE_ROLES = [
            "Caposquadra",
            "Autista",
            "Operatore",
            "Soccorritore",
            "4� Uomo (Affiancamento)"
        ];

        let users = [];
        let loggedUser = JSON.parse(localStorage.getItem('noe_logged')) || null;
        let vehicles = [];
        let inventory = [];
        let shifts = [];
        let historyShifts = [];
        let availabilities = [];
        let waterPoints = [];
        let refuels = [];
        let announcements = [];

        let leafletMap = null;

        function isSuperAdmin() {
            return loggedUser && (loggedUser.ruolo === "Responsabile App" || loggedUser.ruolo === "Responsabile AIB");

        function isManagerRole() {
            return loggedUser && ROLES_MANAGERS.includes(loggedUser.ruolo);
        }

        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        window.loadCloudData = async function() {
            try {
                const usersSnap = await getDocs(collection(db, "users"));
                users = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const vehSnap = await getDocs(collection(db, "vehicles"));
                vehicles = vehSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const invSnap = await getDocs(collection(db, "inventory"));
                inventory = invSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const shiftSnap = await getDocs(collection(db, "shifts"));
                shifts = shiftSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const histSnap = await getDocs(collection(db, "historyShifts"));
                historyShifts = histSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const dispSnap = await getDocs(collection(db, "availabilities"));
                availabilities = dispSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const wpSnap = await getDocs(collection(db, "waterPoints"));
                waterPoints = wpSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const refSnap = await getDocs(collection(db, "refuels"));
                refuels = refSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const annSnap = await getDocs(collection(db, "announcements"));
                announcements = annSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                init();
            } catch (err) {
                console.error("Errore di connessione a Firestore: ", err);
                alert("Errore di connessione al database cloud. Verifica la connessione.");
            }
        };

        window.init = function() {
            if (!loggedUser) {
                renderLogin();
            } else {
                document.getElementById('userInfo').classList.remove('d-none');
                document.getElementById('userInfo').classList.add('d-flex');
                document.getElementById('userRoleBadge').innerText = loggedUser.ruolo;
                renderMainView();
            }
        }

        window.renderLogin = function() {
            document.getElementById('appContainer').innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-md-5">
                        <div class="card p-4 text-center">
                            <img src="logo bianco.png" alt="Logo NOE Rieti" class="logo-noe-main" onerror="this.style.display='none'">
                            <h3 class="mt-2 mb-1 text-primary fw-bold">N.O.E. - Rieti 210</h3>
                            <p class="text-muted mb-1">Nucleo Operativo Emergenza - Gestione Cloud</p>
                            <p class="small text-muted mb-4">C.F. 90041090573 &bull; H24: 3793954151</p>
                            
                            <form onsubmit="handleLogin(event)">
                                <div class="mb-3 text-start">
                                    <label class="form-label">Email o Codice Fiscale</label>
                                    <input type="text" id="loginId" class="form-control" required>
                                </div>
                                <div class="mb-3 text-start">
                                    <label class="form-label">Password</label>
                                    <input type="password" id="loginPass" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-pc w-100 mb-3 fw-bold">Accedi</button>
                            </form>
                            <hr>
                            <button class="btn btn-outline-secondary w-100" onclick="renderRegister()">Non hai un account? Registrati</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.renderRegister = function() {
            let optionsRoles = `<option value="Volontario">Volontario</option>`;
            ROLES_SINGLE.forEach(r => {
                const taken = users.some(u => u.ruolo === r);
                optionsRoles += `<option value="${r}" ${taken ? 'disabled' : ''}>${r} ${taken ? '(Occupato)' : ''}</option>`;
            });

            document.getElementById('appContainer').innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-md-7">
                        <div class="card p-4">
                            <div class="text-center mb-3">
                                <img src="logo bianco.png" alt="Logo NOE Rieti" style="height: 80px; width: auto;" onerror="this.style.display='none'">
                            </div>
                            <h4 class="mb-3 text-primary fw-bold text-center">Registrazione Volontario</h4>
                            <form onsubmit="handleRegister(event)">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Foto Profilo (Obbligatoria)* - Verr� compressa automaticamente</label>
                                    <input type="file" id="regFoto" accept="image/*" class="form-control" required>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label>Nome*</label><input type="text" id="regNome" class="form-control" required></div>
                                    <div class="col-md-6 mb-3"><label>Cognome*</label><input type="text" id="regCognome" class="form-control" required></div>
                                </div>
                                <div class="mb-3"><label>Ruolo Richiesto*</label><select id="regRuolo" class="form-select" required>${optionsRoles}</select></div>
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label>Telefono*</label><input type="tel" id="regTel" class="form-control" required></div>
                                    <div class="col-md-6 mb-3"><label>Email*</label><input type="email" id="regEmail" class="form-control" required></div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label>Codice Fiscale*</label><input type="text" id="regCF" class="form-control" required></div>
                                    <div class="col-md-3 mb-3"><label>Gruppo Sanguigno</label><input type="text" id="regSangue" class="form-control" placeholder="es. 0+"></div>
                                    <div class="col-md-3 mb-3"><label>Taglia Abbigliamento</label><input type="text" id="regTaglia" class="form-control" placeholder="es. L"></div>
                                </div>
                                <div class="mb-3"><label>Password di accesso*</label><input type="password" id="regPass" class="form-control" required></div>
                                <button type="submit" class="btn btn-success w-100 fw-bold">Completa Registrazione</button>
                                <button type="button" class="btn btn-link w-100 mt-2 text-decoration-none" onclick="renderLogin()">Torna al Login</button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleRegister = async function(e) {
            e.preventDefault();
            const fotoFile = document.getElementById('regFoto').files[0];
            if (!fotoFile) return;

            try {
                const compressedDataUrl = await compressImage(fotoFile, 500, 0.7);
                const newUser = {
                    nome: document.getElementById('regNome').value,
                    cognome: document.getElementById('regCognome').value,
                    ruolo: document.getElementById('regRuolo').value,
                    tel: document.getElementById('regTel').value,
                    email: document.getElementById('regEmail').value,
                    cf: document.getElementById('regCF').value,
                    sangue: document.getElementById('regSangue').value,
                    taglia: document.getElementById('regTaglia').value,
                    corsi: "",
                    pass: document.getElementById('regPass').value,
                    foto: compressedDataUrl
                };

                await addDoc(collection(db, "users"), newUser);
                alert('Registrazione completata! Ora puoi accedere.');
                loadCloudData();
            } catch (err) {
                console.error("Errore salvataggio utente:", err);
                alert("Errore durante la registrazione.");
            }
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            const id = document.getElementById('loginId').value.trim().toLowerCase();
            const pass = document.getElementById('loginPass').value;

            const found = users.find(u => (u.email.toLowerCase() === id || u.cf.toLowerCase() === id) && u.pass === pass);
            if (found) {
                loggedUser = found;
                localStorage.setItem('noe_logged', JSON.stringify(loggedUser));
                init();
            } else {
                alert('Credenziali non valide!');
            }
        }

        window.logout = function() {
            localStorage.removeItem('noe_logged');
            loggedUser = null;
            document.getElementById('userInfo').classList.add('d-none');
            renderLogin();
        }

        window.switchTab = function(tab) {
            activeTab = tab;
            if (tab === 'bacheca') {
                markAllAnnouncementsAsRead();
            }
            renderMainView();
        }

        window.markAllAnnouncementsAsRead = async function() {
            const userName = `${loggedUser.nome} ${loggedUser.cognome}`;
            for (let ann of announcements) {
                let letti = ann.lettiDa || [];
                if (!letti.some(l => l.nome === userName)) {
                    try {
                        await updateDoc(doc(db, "announcements", ann.id), {
                            lettiDa: arrayUnion({
                                nome: userName,
                                dataOra: new Date().toLocaleString('it-IT')
                            })
                        });
                    } catch (err) {
                        console.error("Errore marcatura lettura:", err);
                    }
                }
            }
        }

        window.renderMainView = function() {
            const userName = `${loggedUser.nome} ${loggedUser.cognome}`;
            let unreadCount = announcements.filter(ann => {
                let letti = ann.lettiDa || [];
                return !letti.some(l => l.nome === userName);
            }).length;

            let bachecaBadge = unreadCount > 0 ? `<span class="badge bg-danger ms-1 rounded-pill">${unreadCount}</span>` : '';

            document.getElementById('appContainer').innerHTML = `
                <div class="row text-center mb-2">
                    <div class="col-md-12">
                        <h2 class="fw-bold mb-1">Benvenuto, ${loggedUser.nome} ${loggedUser.cognome}</h2>
                        <p class="text-muted">Ruolo Attivo: <strong>${loggedUser.ruolo}</strong></p>
                    </div>
                </div>

                <div class="sticky-menu-bar shadow-sm rounded mb-4">
                    <ul class="nav nav-pills nav-fill bg-white p-2 rounded border flex-wrap gap-1">
                        <li class="nav-item">
                            <a class="nav-link ${activeTab === 'bacheca' ? 'active' : ''}" onclick="switchTab('bacheca')">
                                <i class="bi bi-megaphone-fill me-1"></i> Bacheca Avvisi ${bachecaBadge}
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ${activeTab === 'anagrafica' ? 'active' : ''}" onclick="switchTab('anagrafica')">
                                <i class="bi bi-people-fill me-1"></i> Volontari
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ${activeTab === 'turni' ? 'active' : ''}" onclick="switchTab('turni')">
                                <i class="bi bi-calendar-event me-1"></i> Turni & Servizi
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ${activeTab === 'disponibilita' ? 'active' : ''}" onclick="switchTab('disponibilita')">
                                <i class="bi bi-calendar-check me-1"></i> Disponibilit�
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ${activeTab === 'storico' ? 'active' : ''}" onclick="switchTab('storico')">
                                <i class="bi bi-clock-history me-1"></i> Storico Servizi
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ${activeTab === 'mezzi' ? 'active' : ''}" onclick="switchTab('mezzi')">
                                <i class="bi bi-truck me-1"></i> Mezzi & Scadenze
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ${activeTab === 'rifornimenti' ? 'active' : ''}" onclick="switchTab('rifornimenti')">
                                <i class="bi bi-fuel-pump me-1"></i> Rifornimenti
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ${activeTab === 'mappa' ? 'active' : ''}" onclick="switchTab('mappa')">
                                <i class="bi bi-geo-alt-fill me-1"></i> Mappa Idrica
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ${activeTab === 'magazzino' ? 'active' : ''}" onclick="switchTab('magazzino')">
                                <i class="bi bi-box-seam me-1"></i> Magazzino
                            </a>
                        </li>
                    </ul>
                </div>

                <div id="tabContent"></div>
            `;

            if (activeTab === 'bacheca') {
                renderBacheca();
                markAllAnnouncementsAsRead();
            }
            else if (activeTab === 'anagrafica') renderAnagrafica();
            else if (activeTab === 'turni') renderTurni();
            else if (activeTab === 'disponibilita') renderDisponibilita();
            else if (activeTab === 'storico') renderStorico();
            else if (activeTab === 'mezzi') renderMezzi();
            else if (activeTab === 'rifornimenti') renderRifornimenti();
            else if (activeTab === 'mappa') renderMappa();
            else if (activeTab === 'magazzino') renderMagazzino();
        }

        // --- SEZIONE BACHECA AVVISI ---
        window.renderBacheca = function() {
            const canPost = isManagerRole();
            const isAdmin = isSuperAdmin();

            let annHTML = announcements.map((ann) => {
                let lettiList = ann.lettiDa || [];
                let lettiHtml = `<details class="mt-2 text-muted small"><summary style="cursor: pointer;">Visualizzazioni (${lettiList.length} volontari)</summary><ul class="ps-3 mb-0 mt-1">${lettiList.map(l => `<li>${l.nome} - <em>${l.dataOra}</em></li>`).join('')}</ul></details>`;

                return `
                    <div class="col-md-12 mb-3">
                        <div class="card p-3 border-start border-4 border-warning shadow-sm">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="fw-bold text-primary mb-0">${ann.titolo}</h5>
                                <small class="text-muted">${ann.data}</small>
                            </div>
                            <p class="mb-2 text-dark" style="white-space: pre-line;">${ann.testo}</p>
                            ${lettiHtml}
                            <div class="d-flex justify-content-between align-items-center border-top pt-2 mt-2">
                                <small class="text-secondary">Pubblicato da: <strong>${ann.autore}</strong> (${ann.ruoloAutore})</small>
                                ${isAdmin ? `
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteAnnouncement('${ann.id}')">
                                        <i class="bi bi-trash"></i> Elimina
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('tabContent').innerHTML = `
                ${canPost ? `
                <div class="card p-4 mb-4 bg-light border">
                    <h4 class="fw-bold text-primary mb-3"><i class="bi bi-megaphone me-2"></i>Pubblica Nuovo Avviso in Bacheca</h4>
                    <form onsubmit="addAnnouncement(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Titolo Comunicato*</label>
                            <input type="text" id="annTitolo" class="form-control" placeholder="es. Convocazione Assemblea / Emergenza Meteo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Testo del Messaggio*</label>
                            <textarea id="annTesto" class="form-control" rows="3" placeholder="Scrivi qui l'avviso per i volontari..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-warning fw-bold text-dark"><i class="bi bi-send me-1"></i>Pubblica Avviso</button>
                    </form>
                </div>
                ` : `
                <div class="alert alert-info mb-4">
                    <i class="bi bi-info-circle me-2"></i>Sezione Bacheca in sola lettura. I comunicati ufficiali vengono pubblicati dai Responsabili dell'Associazione.
                </div>
                `}

                <h4 class="fw-bold mb-3"><i class="bi bi-pin-angle me-2"></i>Comunicati ed Avvisi Ufficiali (${announcements.length})</h4>
                <div class="row">${announcements.length > 0 ? annHTML : '<div class="col-12 text-muted">Nessun avviso presente in bacheca.</div>'}</div>
            `;
        }

        window.addAnnouncement = async function(e) {
            e.preventDefault();
            const newAnn = {
                titolo: document.getElementById('annTitolo').value,
                testo: document.getElementById('annTesto').value,
                data: new Date().toLocaleString('it-IT'),
                autore: `${loggedUser.nome} ${loggedUser.cognome}`,
                ruoloAutore: loggedUser.ruolo,
                lettiDa: []
            };

            try {
                await addDoc(collection(db, "announcements"), newAnn);
                alert("Avviso pubblicato in bacheca!");
                loadCloudData();
            } catch (err) {
                console.error("Errore avviso:", err);
            }
        }

        window.deleteAnnouncement = async function(id) {
            if (confirm("Sei sicuro di voler eliminare questo avviso dalla bacheca?")) {
                try {
                    await deleteDoc(doc(db, "announcements", id));
                    loadCloudData();
                } catch (err) {
                    console.error("Errore eliminazione avviso:", err);
                }
            }
        }

        // --- SEZIONE ANAGRAFICA ---
        window.renderAnagrafica = function() {
            const isAdmin = isSuperAdmin();

            let usersListHTML = users.map((u, index) => {
                let adminActions = '';
                if (isAdmin) {
                    adminActions = `
                        <div class="mt-2 pt-2 border-top bg-light p-2 rounded">
                            <label class="small fw-bold text-danger mb-1">Pannello Modifica (Responsabile App/AIB):</label>

        window.toggleVolOptions = function(idx) {
            const cb = document.getElementById(`vol_cb_${idx}`);

        window.toggleChecklistMansione = function(idx) {
            const role = document.getElementById(`vol_ruolo_${idx}`).value;
            const chkCS = document.getElementById(`checklist_cs_${idx}`);
            const chkAut = document.getElementById(`checklist_aut_${idx}`);

            chkCS.classList.add('d-none');
            chkAut.classList.add('d-none');

            if (role === 'Caposquadra') {
                chkCS.classList.remove('d-none');
            } else if (role === 'Autista') {
                chkAut.classList.remove('d-none');
            }
        }

        window.addShift = async function(e) {
            e.preventDefault();
            let selectedVols = [];

            users.forEach((u, idx) => {
                const cb = document.getElementById(`vol_cb_${idx}`);
                if (cb && cb.checked) {
                    const rOp = document.getElementById(`vol_ruolo_${idx}`).value;
                    let mansioniChecked = false;
                    if (rOp === 'Caposquadra') {
                        mansioniChecked = document.getElementById(`chk_cs_${idx}`).checked;
                        if (!mansioniChecked) {
                            alert(`Il caposquadra ${u.nome} ${u.cognome} deve spuntare la mansione obbligatoria di controllo DPI/Radio!`);
                            throw new Error("Mansione obbligatoria mancante");
                        }
                    } else if (rOp === 'Autista') {
                        mansioniChecked = document.getElementById(`chk_aut_${idx}`).checked;
                        if (!mansioniChecked) {
                            alert(`L'autista ${u.nome} ${u.cognome} deve spuntare la mansione obbligatoria di controllo liquidi/mezzo!`);
                            throw new Error("Mansione obbligatoria mancante");
                        }
                    }

                    selectedVols.push({
                        nome: `${u.nome} ${u.cognome}`,
                        ruoloOperativo: rOp,
                        mansioniSpuntate: mansioniChecked
                    });
                }
            });

            if(selectedVols.length === 0) {
                alert("Seleziona almeno un volontario per il turno!");
                return;
            }

            const mezzoId = document.getElementById('shiftMezzo').value;
            let mezzoStr = "Nessun Mezzo";
            let vehicleObj = null;

            if (mezzoId !== "Nessun Mezzo") {
                vehicleObj = vehicles.find(v => v.id === mezzoId);
                if (vehicleObj) {
                    mezzoStr = `${vehicleObj.modello} (${vehicleObj.targa})`;
                }
            }

            const newShift = {
                tipoServizio: document.getElementById('shiftTipo').value,
                data: document.getElementById('shiftData').value,
                oraInizio: document.getElementById('shiftOraInizio').value,
                oraFine: document.getElementById('shiftOraFine').value,
                mezzoId: mezzoId,
                mezzoUsato: mezzoStr,
                kmInizialiMezzo: vehicleObj ? vehicleObj.km : 0,
                note: document.getElementById('shiftNote').value,
                volontariDettaglio: selectedVols
            };

            try {
                await addDoc(collection(db, "shifts"), newShift);
                alert("Turno salvato ed aperto con successo!");
                loadCloudData();
            } catch (err) {
                console.error("Errore turno:", err);
            }
        }

        window.closeShiftModal = async function(shiftId, index) {
            const shiftToClose = shifts[index];
            const oraFineReale = prompt("Inserisci l'ora di fine effettiva del servizio (HH:MM):", shiftToClose.oraFine) || shiftToClose.oraFine;

            let kmPercorsi = 0;
            let kmFinali = 0;

            if (shiftToClose.mezzoId && shiftToClose.mezzoId !== "Nessun Mezzo") {
                const currentVehicle = vehicles.find(v => v.id === shiftToClose.mezzoId);
                const kmAttuali = currentVehicle ? currentVehicle.km : (shiftToClose.kmInizialiMezzo || 0);

                const kmFinaliInput = prompt(`Inserisci i KM FINALI segnati sul contachilometri del mezzo (${shiftToClose.mezzoUsato}). KM attuali registrati: ${kmAttuali}`, kmAttuali);
                
                if (kmFinaliInput !== null) {
                    kmFinali = parseInt(kmFinaliInput, 10) || kmAttuali;
                    if (kmFinali < kmAttuali) {
                        alert("I KM finali non possono essere inferiori a quelli iniziali!");
                        return;
                    }
                    kmPercorsi = kmFinali - kmAttuali;

                    if (currentVehicle) {
                        await updateDoc(doc(db, "vehicles", currentVehicle.id), { km: kmFinali });
                    }
                }
            } else {
                const kmManual = prompt("KM percorsi durante il servizio:", "0");
                kmPercorsi = parseInt(kmManual, 10) || 0;
            }

            const completedShift = {
                ...shiftToClose,
                oraFine: oraFineReale,
                kmFinaliMezzo: kmFinali,
                kmPercorsi: kmPercorsi,
                dataChiusura: new Date().toLocaleDateString('it-IT')
            };

            try {
                await addDoc(collection(db, "historyShifts"), completedShift);
                await deleteDoc(doc(db, "shifts", shiftId));
                alert(`Servizio chiuso! Percorsi ${kmPercorsi} km. Chilometraggio del mezzo aggiornato nel database.`);
                loadCloudData();
            } catch (err) {
                console.error("Errore chiusura:", err);
            }
        }

            };

            try {
                await addDoc(collection(db, "inventory"), newItem);
                alert('Attrezzatura aggiunta!');
                loadCloudData();
            } catch (err) {
                console.error("Errore magazzino:", err);
            }
        }

        window.updateStock = async function(itemId, currentQta, change) {
            const newQta = Math.max(0, currentQta + change);
            try {
                await updateDoc(doc(db, "inventory", itemId), { qta: newQta });
                loadCloudData();
            } catch (err) {
                console.error("Errore stock:", err);
            }
        }

        window.deleteInventoryItem = async function(id) {
            if (confirm("Sei sicuro di voler eliminare questo articolo dal magazzino?")) {
                try {
                    await deleteDoc(doc(db, "inventory", id));
                    loadCloudData();
                } catch (err) {
                    console.error("Errore eliminazione magazzino:", err);
                }
            }
        }

        loadCloudData();
    </script>
</body>
</html>
