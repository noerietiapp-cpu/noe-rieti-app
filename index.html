        const firebaseConfig = {
            apiKey: "AIzaSyC3Nu_m2eCSPre7XBOJbGXs0s6dU_N1E4",
            authDomain: "noe-rieti-app.firebaseapp.com",
            projectId: "noe-rieti-app",
            storageBucket: "noe-rieti-app.appspot.com",

            appId: "1:681497158437:web:38b313c27c55c8afe7e00c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ROLES_SINGLE = [
            "Presidente (Legale Rappresentante)",

        let users = [];

        let vehicles = [];

        let historyShifts = [];

        function isSuperAdmin() {
            return loggedUser && (loggedUser.ruolo === "Responsabile App" || loggedUser.ruolo === "Responsabile AIB");

            return loggedUser && loggedUser.ruolo === "Responsabile App";

        function isManagerRole() {
            return loggedUser && ROLES_MANAGERS.includes(loggedUser.ruolo);
        }

        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
window.loadCloudData = async function() {
            try {
                const usersSnap = await getDocs(collection(db, "users"));
                users = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const vehSnap = await getDocs(collection(db, "vehicles"));
                vehicles = vehSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const shiftSnap = await getDocs(collection(db, "shifts"));
                shifts = shiftSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const histSnap = await getDocs(collection(db, "historyShifts"));
                historyShifts = histSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const dispSnap = await getDocs(collection(db, "availabilities"));
                availabilities = dispSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const wpSnap = await getDocs(collection(db, "waterPoints"));
                waterPoints = wpSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const refSnap = await getDocs(collection(db, "refuels"));
                refuels = refSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                const annSnap = await getDocs(collection(db, "announcements"));
                announcements = annSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                try {
                    const repSnap = await getDocs(collection(db, "uploadedReports"));
                    uploadedReports = repSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch(e) { uploadedReports = []; }

                init();
            } catch (err) {
                console.error("Errore di connessione a Firestore: ", err);
                alert("Errore di connessione al database cloud. Verifica la connessione.");
            }
        };

        window.updatePresence = async function() {
            if (!loggedUser || !loggedUser.id) return;
            try {
                await updateDoc(doc(db, "users", loggedUser.id), {
                    lastSeen: new Date().getTime()
                });
            } catch (e) {
                console.error("Errore aggiornamento presenza:", e);
            }
        }

        window.renderOnlineCounter = function() {
            const onlineBar = document.getElementById('onlineBar');
            if (!loggedUser) {
                if (onlineBar) onlineBar.classList.add('d-none');
                return;
            }

            if (onlineBar) onlineBar.classList.remove('d-none');

            const fiveMinutesAgo = new Date().getTime() - (5 * 60 * 1000);
            const count = users.filter(u => u.lastSeen && u.lastSeen > fiveMinutesAgo).length;
            const finalCount = Math.max(1, count);
            
            const countElem = document.getElementById('onlineCount');
            if (countElem) {
                countElem.innerText = finalCount;
            }
        }

        window.init = function() {
            if (!loggedUser) {
                renderLogin();
                const onlineBar = document.getElementById('onlineBar');
                if (onlineBar) onlineBar.classList.add('d-none');
            } else {
                document.getElementById('userInfo').classList.remove('d-none');
                document.getElementById('userInfo').classList.add('d-flex');
                document.getElementById('userRoleBadge').innerText = loggedUser.ruolo;

                updatePresence();
                renderOnlineCounter();

                if (!window.presenceInterval) {
                    window.presenceInterval = setInterval(() => {
                        updatePresence();
                        loadCloudData();
                    }, 60000);
                }

                const archiveContainer = document.getElementById('archiveBtnContainer');
                if (isManagerRole()) {
                    archiveContainer.innerHTML = `
                        <button class="btn btn-info btn-sm fw-bold text-white" onclick="switchTab('archivioReport')" title="Archivio Report Mensili Pubblicati">
                            <i class="bi bi-folder-symlink-fill me-1"></i> Archivio Report
                        </button>
                    `;
                } else {
                    archiveContainer.innerHTML = '';
                }

                const creatorContainer = document.getElementById('creatorReportBtnContainer');
                if (isAppCreator()) {
                    creatorContainer.innerHTML = `
                        <button class="btn btn-warning btn-sm fw-bold text-dark" onclick="downloadWordReport()" title="Scarica Report Operativo Mensile Word">
                            <i class="bi bi-file-earmark-word-fill me-1"></i> Report Word (.doc)
                        </button>
                    `;
                } else {
                    creatorContainer.innerHTML = '';
                }

                renderMainView();
            }
        }
window.renderLogin = function() {
            document.getElementById('appContainer').innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-md-5">
                        <div class="card p-4 text-center">
                            <img src="logo bianco.png" alt="Logo NOE Rieti" class="logo-noe-main" onerror="this.style.display='none'">
                            <h3 class="mt-2 mb-1 text-primary fw-bold">N.O.E. - Rieti 210</h3>
                            <p class="text-muted mb-1">Nucleo Operativo Emergenza - Gestione Cloud</p>
                            <p class="small text-muted mb-4">C.F. 90041090573 &bull; H24: 3793954151</p>
                            
                            <form onsubmit="handleLogin(event)">
                                <div class="mb-3 text-start">
                                    <label class="form-label">Email o Codice Fiscale</label>
                                    <input type="text" id="loginId" class="form-control" required>
                                </div>
                                <div class="mb-3 text-start">
                                    <label class="form-label">Password</label>
                                    <input type="password" id="loginPass" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-pc w-100 mb-3 fw-bold">Accedi</button>
                            </form>
                            <hr>
                            <button class="btn btn-outline-secondary w-100" onclick="renderRegister()">Non hai un account? Registrati</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.renderRegister = function() {
            let optionsRoles = `<option value="Volontario">Volontario</option>`;
            ROLES_SINGLE.forEach(r => {
                const taken = users.some(u => u.ruolo === r);
                optionsRoles += `<option value="${r}" ${taken ? 'disabled' : ''}>${r} ${taken ? '(Occupato)' : ''}</option>`;
            });

            document.getElementById('appContainer').innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-md-7">
                        <div class="card p-4">
                            <div class="text-center mb-3">
                                <img src="logo bianco.png" alt="Logo NOE Rieti" style="height: 80px; width: auto;" onerror="this.style.display='none'">
                            </div>
                            <h4 class="mb-3 text-primary fw-bold text-center">Registrazione Volontario</h4>
                            <form onsubmit="handleRegister(event)">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Foto Profilo (Obbligatoria)* - Verrà compressa automaticamente</label>
                                    <input type="file" id="regFoto" accept="image/*" class="form-control" required>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label>Nome*</label><input type="text" id="regNome" class="form-control" required></div>
                                    <div class="col-md-6 mb-3"><label>Cognome*</label><input type="text" id="regCognome" class="form-control" required></div>
                                </div>
                                <div class="mb-3"><label>Ruolo Richiesto*</label><select id="regRuolo" class="form-select" required>${optionsRoles}</select></div>
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label>Telefono*</label><input type="tel" id="regTel" class="form-control" required></div>
                                    <div class="col-md-6 mb-3"><label>Email*</label><input type="email" id="regEmail" class="form-control" required></div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label>Codice Fiscale*</label><input type="text" id="regCF" class="form-control" required></div>
                                    <div class="col-md-3 mb-3"><label>Gruppo Sanguigno</label><input type="text" id="regSangue" class="form-control" placeholder="es. 0+"></div>
                                    <div class="col-md-3 mb-3"><label>Taglia Abbigliamento</label><input type="text" id="regTaglia" class="form-control" placeholder="es. L"></div>
                                </div>
                                <div class="mb-3"><label>Password di accesso*</label><input type="password" id="regPass" class="form-control" required></div>
                                <button type="submit" class="btn btn-success w-100 fw-bold">Completa Registrazione</button>
                                <button type="button" class="btn btn-link w-100 mt-2 text-decoration-none" onclick="renderLogin()">Torna al Login</button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleRegister = async function(e) {
            e.preventDefault();
            const fotoFile = document.getElementById('regFoto').files[0];
            if (!fotoFile) return;

            try {
                const compressedDataUrl = await compressImage(fotoFile, 500, 0.7);
                const newUser = {
                    nome: document.getElementById('regNome').value,
                    cognome: document.getElementById('regCognome').value,
                    ruolo: document.getElementById('regRuolo').value,
                    tel: document.getElementById('regTel').value,
                    email: document.getElementById('regEmail').value,
                    cf: document.getElementById('regCF').value,
                    sangue: document.getElementById('regSangue').value,
                    taglia: document.getElementById('regTaglia').value,
                    corsi: "",
                    pass: document.getElementById('regPass').value,
                    foto: compressedDataUrl
                };

                await addDoc(collection(db, "users"), newUser);
                alert('Registrazione completata! Ora puoi accedere.');
                loadCloudData();
            } catch (err) {
                console.error("Errore salvataggio utente:", err);
                alert("Errore durante la registrazione.");
            }
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            const id = document.getElementById('loginId').value.trim().toLowerCase();
            const pass = document.getElementById('loginPass').value;

            const found = users.find(u => (u.email.toLowerCase() === id || u.cf.toLowerCase() === id) && u.pass === pass);
            if (found) {
                loggedUser = found;
                localStorage.setItem('noe_logged', JSON.stringify(loggedUser));
                init();
            } else {
                alert('Credenziali non valide!');
            }
        }

        window.logout = function() {
            if (window.presenceInterval) {
                clearInterval(window.presenceInterval);
                window.presenceInterval = null;
            }
            localStorage.removeItem('noe_logged');
            loggedUser = null;
            document.getElementById('userInfo').classList.add('d-none');
            const onlineBar = document.getElementById('onlineBar');
            if (onlineBar) onlineBar.classList.add('d-none');
            renderLogin();
        }

        window.switchTab = function(tab) {
            activeTab = tab;
            if (tab === 'bacheca') {
                markAllAnnouncementsAsRead();
            }
            renderMainView();
        }

        window.markAllAnnouncementsAsRead = async function() {
            const userName = `${loggedUser.nome} ${loggedUser.cognome}`;
            for (let ann of announcements) {
                let letti = ann.lettiDa || [];
                if (!letti.some(l => l.nome === userName)) {
                    try {
                        await updateDoc(doc(db, "announcements", ann.id), {
                            lettiDa: arrayUnion({
                                nome: userName,
                                dataOra: new Date().toLocaleString('it-IT')
                            })
                        });
                    } catch (err) {
                        console.error("Errore marcatura lettura:", err);
                    }
                }
            }
        }

            const userName = `${loggedUser.nome} ${loggedUser.cognome}`;
            let unreadCount = announcements.filter(ann => {
                let letti = ann.lettiDa || [];
                return !letti.some(l => l.nome === userName);
            }).length;

            let bachecaBadge = unreadCount > 0 ? `<span class="badge bg-danger ms-1 rounded-pill">${unreadCount}</span>` : '';

            document.getElementById('appContainer').innerHTML = `
                <div class="row text-center mb-2">
                    <div class="col-md-12">
                        <h2 class="fw-bold mb-1">Benvenuto, ${loggedUser.nome} ${loggedUser.cognome}</h2>
                        <p class="text-muted">Ruolo Attivo: <strong>${loggedUser.ruolo}</strong></p>
                    </div>
                </div>

                <div class="sticky-menu-bar shadow-sm rounded mb-4">
                    <ul class="nav nav-pills fixed-menu-container bg-white p-2 rounded border">

                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ${activeTab === 'turni' ? 'active' : ''}" onclick="switchTab('turni')">
                                <i class="bi bi-calendar-event me-1"></i> Turni & Servizi

                        </li>

                                <i class="bi bi-calendar-check me-1"></i> Disponibilità
                            </a>

                        </li>
                        <li class="nav-item">

                                <i class="bi bi-fuel-pump me-1"></i> Rifornimenti

                        </li>

                                <i class="bi bi-geo-alt-fill me-1"></i> Mappa Idrica
                            </a>
                        </li>
                    </ul>
                </div>

                <div id="tabContent"></div>
            `;

            if (activeTab === 'bacheca') {
                renderBacheca();
                markAllAnnouncementsAsRead();
            }
            else if (activeTab === 'anagrafica') renderAnagrafica();
            else if (activeTab === 'turni') renderTurni();
            else if (activeTab === 'disponibilita') renderDisponibilita();
            else if (activeTab === 'storico') renderStorico();
            else if (activeTab === 'mezzi') renderMezzi();
            else if (activeTab === 'rifornimenti') renderRifornimenti();
            else if (activeTab === 'mappa') renderMappa();
            else if (activeTab === 'archivioReport') renderArchivioReport();
            
            renderOnlineCounter();
        }

        window.renderBacheca = function() {
            const canPost = isManagerRole();
            const isAdmin = isSuperAdmin();

        window.downloadWordReport = function() {

            if (!inputMonth) return;

            const [mStr, yStr] = inputMonth.split('/');
            const monthInt = parseInt(mStr, 10);
            const yearInt = parseInt(yStr, 10);

            if (isNaN(monthInt) || isNaN(yearInt) || monthInt < 1 || monthInt > 12) {
                alert("Formato data non valido! Usa MM/AAAA (es. 10/2026).");
                return;
            }

            let filteredShifts = historyShifts.filter(s => {
                if (!s.data) return false;
                const parts = s.data.split('-');
                if (parts.length === 3) {
                    const year = parseInt(parts[0], 10);
                    const month = parseInt(parts[1], 10);
                    return year === yearInt && month === monthInt;
                }
                return false;
            });
            filteredShifts.sort((a, b) => a.data.localeCompare(b.data) || a.oraInizio.localeCompare(b.oraInizio));

            let filteredRefuels = refuels.filter(r => {

        window.addShift = async function(e) {
            e.preventDefault();
            let selectedVols = [];

            users.forEach((u, idx) => {
                const cb = document.getElementById(`vol_cb_${idx}`);
                if (cb && cb.checked) {
                    let rolesList = [];
                    OPERATIVE_ROLES.forEach(r => {
                        let checkboxId = '';
                        if (r === 'Caposquadra') checkboxId = `role_cs_${idx}`;
                        else if (r === 'Autista') checkboxId = `role_aut_${idx}`;
                        else if (r === 'Operatore') checkboxId = `role_op_${idx}`;
                        else if (r === 'Soccorritore') checkboxId = `role_soc_${idx}`;
                        else if (r === '4° Uomo (Affiancamento)') checkboxId = `role_4th_${idx}`;

                        if (checkboxId && document.getElementById(checkboxId).checked) {
                            rolesList.push(r);
                        }
                    });

                    if (rolesList.length === 0) {
                        alert(`Seleziona almeno un ruolo operativo per ${u.nome} ${u.cognome}!`);
                        throw new Error("Ruolo operativo mancante");
                    }

                    if (rolesList.includes('Caposquadra')) {
                        if (!document.getElementById(`chk_cs_${idx}`).checked) {
                            alert(`Il caposquadra ${u.nome} ${u.cognome} deve spuntare la mansione obbligatoria di controllo DPI/Radio!`);
                            throw new Error("Mansione obbligatoria mancante");
                        }
                    }
                    if (rolesList.includes('Autista')) {
                        if (!document.getElementById(`chk_aut_${idx}`).checked) {
                            alert(`L'autista ${u.nome} ${u.cognome} deve spuntare la mansione obbligatoria di controllo liquidi/mezzo!`);
                            throw new Error("Mansione obbligatoria mancante");
                        }
                    }

                    selectedVols.push({

                        ruoloOperativo: rolesList.join(' + '),
                        mansioniSpuntate: true
                    });
                }
            });

            if(selectedVols.length === 0) {
                alert("Seleziona almeno un volontario per il turno!");
                return;
            }

            const mezzoId = document.getElementById('shiftMezzo').value;
            let mezzoStr = "Nessun Mezzo";
            let vehicleObj = null;

            if (mezzoId !== "Nessun Mezzo") {

                alert("Turno salvato ed aperto con successo!");
                loadCloudData();
            } catch (err) {
                console.error("Errore turno:", err);
            }
        }

                        <strong>Squadra Impiegata:</strong>
                        <ul class="list-unstyled mt-1 small mb-0">
                            ${s.volontariDettaglio ? s.volontariDettaglio.map(v => `<li><i class="bi bi-person-check me-1"></i>${v.nome} - <em>${v.ruoloOperativo}</em></li>`).join('') : ''}
                        </ul>
                        ${isAdmin ? `
                            <div class="text-end mt-2 pt-2 border-top">
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteHistoryShift('${s.id}')">
                                    <i class="bi bi-trash"></i> Elimina dallo Storico
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            document.getElementById('tabContent').innerHTML = `
                <h4 class="fw-bold mb-3"><i class="bi bi-clock-history me-2"></i>Storico Servizi Conclusi (${historyShifts.length})</h4>
                <div class="row">${historyShifts.length > 0 ? histHTML : '<div class="col-12 text-muted">Nessun servizio nello storico.</div>'}</div>
            `;
        }

        window.deleteHistoryShift = async function(id) {
            if (confirm("Sei sicuro di voler eliminare questo record dallo storico?")) {
                try {
                    await deleteDoc(doc(db, "historyShifts", id));
                    loadCloudData();
                } catch (err) {
                    console.error("Errore eliminazione storico:", err);
                }
            }
        }
// --- SEZIONE MEZZI & SCADENZE ---
        window.renderMezzi = function() {
            const isAdmin = isSuperAdmin();

            let vehiclesHTML = vehicles.map((v) => {
                return `
                    <div class="col-md-4 mb-3">
                        <div class="card p-3 h-100">
                            <img src="${v.foto}" class="vehicle-img mb-3" alt="Foto Mezzo">
                            <h4 class="fw-bold text-primary mb-1">${v.modello}</h4>
                            <p class="mb-1"><strong>Targa:</strong> ${v.targa}</p>
                            <p class="mb-1"><strong>Chilometraggio:</strong> ${v.km} km</p>
                            <hr class="my-2">
                            <p class="mb-1 text-danger small"><strong>Assicurazione Scadenza:</strong> ${v.scadAssicurazione || 'Non indicata'}</p>
                            <p class="mb-1 text-danger small"><strong>Revisione Scadenza:</strong> ${v.scadRevisione || 'Non indicata'}</p>
                            <p class="mb-1 text-danger small"><strong>Tagliando Scadenza:</strong> ${v.scadTagliando || 'Non indicato'}</p>
                            ${isAdmin ? `
                                <div class="mt-3 pt-2 border-top">
                                    <button class="btn btn-outline-danger btn-sm w-100" onclick="deleteVehicle('${v.id}')">
                                        <i class="bi bi-trash me-1"></i>Elimina Mezzo
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('tabContent').innerHTML = `
                ${isAdmin ? `
                <div class="card p-4 mb-4 bg-light border">
                    <h4 class="fw-bold text-primary mb-3"><i class="bi bi-truck me-2"></i>Registra Nuovo Automezzo in Flotta</h4>
                    <form onsubmit="addVehicle(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Foto Automezzo (Obbligatoria)*</label>
                            <input type="file" id="vehFoto" accept="image/*" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Modello / Nome Mezzo*</label>
                                <input type="text" id="vehModello" class="form-control" placeholder="es. Iveco Daily AIB" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Targa*</label>
                                <input type="text" id="vehTarga" class="form-control" placeholder="es. AB123CD" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">KM Iniziali*</label>
                                <input type="number" id="vehKm" class="form-control" value="0" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label text-danger">Scadenza Assicurazione</label>
                                <input type="date" id="vehAss" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label text-danger">Scadenza Revisione</label>
                                <input type="date" id="vehRev" class="form-control">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-danger">Scadenza Tagliando</label>
                            <input type="date" id="vehTag" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary fw-bold">Aggiungi Mezzo alla Flotta</button>
                    </form>
                </div>
                ` : ''}

                <h4 class="fw-bold mb-3"><i class="bi bi-shield-check me-2"></i>Parco Automezzi e Scadenze (${vehicles.length})</h4>
                <div class="row">${vehicles.length > 0 ? vehiclesHTML : '<div class="col-12 text-muted">Nessun mezzo registrato.</div>'}</div>
            `;
        }

        window.addVehicle = async function(e) {
            e.preventDefault();
            const fotoFile = document.getElementById('vehFoto').files[0];
            if (!fotoFile) return;

            try {
                const compressedDataUrl = await compressImage(fotoFile, 800, 0.7);
                const newVeh = {
                    modello: document.getElementById('vehModello').value,
                    targa: document.getElementById('vehTarga').value,
                    km: parseInt(document.getElementById('vehKm').value, 10) || 0,
                    scadAssicurazione: document.getElementById('vehAss').value,
                    scadRevisione: document.getElementById('vehRev').value,
                    scadTagliando: document.getElementById('vehTag').value,
                    foto: compressedDataUrl
                };

                await addDoc(collection(db, "vehicles"), newVeh);
                alert("Automezzo aggiunto con successo!");
                loadCloudData();
            } catch (err) {
                console.error("Errore mezzo:", err);
            }
        }

        window.deleteVehicle = async function(id) {
            if (confirm("Sei sicuro di voler eliminare questo mezzo dalla flotta?")) {
                try {
                    await deleteDoc(doc(db, "vehicles", id));
                    loadCloudData();
                } catch (err) {
                    console.error("Errore eliminazione mezzo:", err);
                }
            }
        }

        // --- SEZIONE RIFORNIMENTI ---
        window.renderRifornimenti = function() {
            const isAdmin = isSuperAdmin();

            let refHTML = refuels.map((r) => `
                <div class="col-md-4 mb-3">
                    <div class="card p-3 h-100">
                        <img src="${r.fotoScontrino}" class="receipt-img mb-2" alt="Foto Scontrino">
                        <h5 class="fw-bold text-primary mb-1">${r.mezzo}</h5>
                        <p class="mb-1"><strong>Data / Ora:</strong> ${r.data} - ${r.ora}</p>
                        <p class="mb-1"><strong>Litri:</strong> ${r.litri} L | <strong>Importo:</strong> &euro; ${r.importo.toFixed(2)}</p>
                        <p class="mb-1 small text-muted"><strong>Registrato da:</strong> ${r.volontario}</p>
                        ${isAdmin ? `
                            <div class="text-end mt-2 pt-2 border-top">
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteRefuel('${r.id}')">
                                    <i class="bi bi-trash"></i> Elimina
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            let optionsMezziRef = vehicles.map(v => `<option value="${v.modello} [${v.targa}]">${v.modello} [${v.targa}]</option>`).join('');

            document.getElementById('tabContent').innerHTML = `
                <div class="card p-4 mb-4 bg-light border">
                    <h4 class="fw-bold text-primary mb-3"><i class="bi bi-fuel-pump me-2"></i>Registra Rifornimento Carburante</h4>
                    <form onsubmit="addRefuel(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Foto Scontrino / Ricevuta (Obbligatoria)*</label>
                            <input type="file" id="refFoto" accept="image/*" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Mezzo Rifornito*</label>
                                <select id="refMezzo" class="form-select" required>
                                    ${optionsMezziRef}
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Litri Erogati*</label>
                                <input type="number" step="0.01" id="refLitri" class="form-control" placeholder="es. 45.5" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Importo Totale (&euro;)*</label>
                                <input type="number" step="0.01" id="refImporto" class="form-control" placeholder="es. 85.00" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Data Rifornimento*</label>
                                <input type="date" id="refData" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ora*</label>
                                <input type="time" id="refOra" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning fw-bold text-dark"><i class="bi bi-check-circle me-1"></i>Salva Rifornimento</button>
                    </form>
                </div>

                <h4 class="fw-bold mb-3"><i class="bi bi-receipt me-2"></i>Storico Rifornimenti Flotta (${refuels.length})</h4>
                <div class="row">${refuels.length > 0 ? refHTML : '<div class="col-12 text-muted">Nessun rifornimento registrato.</div>'}</div>
            `;

            document.getElementById('refData').value = new Date().toISOString().split('T')[0];
            const now = new Date();
            document.getElementById('refOra').value = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }

        window.addRefuel = async function(e) {
            e.preventDefault();
            const fotoFile = document.getElementById('refFoto').files[0];
            if (!fotoFile) return;

            try {
                const compressedDataUrl = await compressImage(fotoFile, 800, 0.7);
                const newRef = {
                    mezzo: document.getElementById('refMezzo').value,
                    litri: parseFloat(document.getElementById('refLitri').value) || 0,
                    importo: parseFloat(document.getElementById('refImporto').value) || 0,
                    data: document.getElementById('refData').value,
                    ora: document.getElementById('refOra').value,
                    volontario: `${loggedUser.nome} ${loggedUser.cognome}`,
                    fotoScontrino: compressedDataUrl
                };

                await addDoc(collection(db, "refuels"), newRef);
                alert("Rifornimento registrato con successo!");
                loadCloudData();
            } catch (err) {
                console.error("Errore rifornimento:", err);
            }
        }

        window.deleteRefuel = async function(id) {
            if (confirm("Sei sicuro di voler eliminare questo rifornimento?")) {
                try {
                    await deleteDoc(doc(db, "refuels", id));
                    loadCloudData();
                } catch (err) {
                    console.error("Errore eliminazione rifornimento:", err);
                }
            }
        }
// --- SEZIONE MAPPA IDRICA ---
        window.renderMappa = function() {
            const isAdmin = isSuperAdmin();

            let wpHTML = waterPoints.map((wp) => `
                <div class="col-md-4 mb-3">
                    <div class="card p-3 h-100">
                        <img src="${wp.foto}" class="hydrant-img mb-2" alt="Foto Punto Acqua">
                        <h5 class="fw-bold text-primary mb-1">${wp.nome}</h5>
                        <p class="mb-1"><strong>Tipo:</strong> ${wp.tipo}</p>
                        <p class="mb-1"><strong>Portata / Note:</strong> ${wp.portata || 'N/D'}</p>
                        <p class="mb-1 small text-muted"><strong>Coordinate:</strong> ${wp.lat.toFixed(4)}, ${wp.lng.toFixed(4)}</p>
                        ${isAdmin ? `
                            <div class="text-end mt-2 pt-2 border-top">
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteWaterPoint('${wp.id}')">
                                    <i class="bi bi-trash"></i> Elimina
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            document.getElementById('tabContent').innerHTML = `
                ${isAdmin ? `
                <div class="card p-4 mb-4 bg-light border">
                    <h4 class="fw-bold text-primary mb-3"><i class="bi bi-geo-alt me-2"></i>Aggiungi Nuovo Punto Idrico (Idrante / Riserva)</h4>
                    <form onsubmit="addWaterPoint(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Foto Punto Acqua (Obbligatoria)*</label>
                            <input type="file" id="wpFoto" accept="image/*" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Nome / Identificativo*</label>
                                <input type="text" id="wpNome" class="form-control" placeholder="es. Idrante Via Salaria km 50" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Tipologia*</label>
                                <select id="wpTipo" class="form-select">
                                    <option value="Idrante a Colonnina">Idrante a Colonnina</option>
                                    <option value="Idrante Sottosuolo">Idrante Sottosuolo</option>
                                    <option value="Vasca / Punto Attingimento AIB">Vasca / Punto Attingimento AIB</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3"><label>Latitudine*</label><input type="number" step="any" id="wpLat" class="form-control" required></div>
                            <div class="col-md-4 mb-3"><label>Longitudine*</label><input type="number" step="any" id="wpLng" class="form-control" required></div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">&nbsp;</label>
                                <button type="button" class="btn btn-outline-secondary w-100" onclick="getGPSCoordinates()">Ottieni GPS Attuale</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Portata / Pressione / Note</label>
                            <input type="text" id="wpPortata" class="form-control" placeholder="es. Ottima pressione, raccordo UNI 45">
                        </div>
                        <button type="submit" class="btn btn-primary fw-bold">Salva Punto sulla Mappa</button>
                    </form>
                </div>
                ` : ''}

                <h4 class="fw-bold mb-3"><i class="bi bi-map me-2"></i>Mappa Interattiva Punti Idrici Territorio (${waterPoints.length})</h4>
                <div class="card p-3 mb-4"><div id="map"></div></div>

                <h4 class="fw-bold mb-3">Elenco Punti Idrici Registrati</h4>
                <div class="row">${waterPoints.length > 0 ? wpHTML : '<div class="col-12 text-muted">Nessun punto idrico registrato.</div>'}</div>
            `;

            setTimeout(() => {
                if (leafletMap) {
                    leafletMap.remove();
                }
                let centerLat = 42.3944;
                let centerLng = 12.8575;
                if (waterPoints.length > 0) {
                    centerLat = waterPoints[0].lat;
                    centerLng = waterPoints[0].lng;
                }

                leafletMap = L.map('map').setView([centerLat, centerLng], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(leafletMap);

                waterPoints.forEach(wp => {
                    let marker = L.marker([wp.lat, wp.lng]).addTo(leafletMap);
                    marker.bindPopup(`<b>${wp.nome}</b><br>Tipo: ${wp.tipo}<br>Note: ${wp.portata || 'N/D'}`);
                });
            }, 300);
        }

        window.getGPSCoordinates = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    document.getElementById('wpLat').value = position.coords.latitude;
                    document.getElementById('wpLng').value = position.coords.longitude;
                    alert("Coordinate GPS acquisite con successo!");
                }, error => {
                    alert("Impossibile rilevare la posizione GPS: " + error.message);
                });
            } else {
                alert("Geolocalizzazione non supportata dal browser.");
            }
        }

        window.addWaterPoint = async function(e) {
            e.preventDefault();
            const fotoFile = document.getElementById('wpFoto').files[0];
            if (!fotoFile) return;

            try {
                const compressedDataUrl = await compressImage(fotoFile, 800, 0.7);
                const newWp = {
                    nome: document.getElementById('wpNome').value,
                    tipo: document.getElementById('wpTipo').value,
                    lat: parseFloat(document.getElementById('wpLat').value),
                    lng: parseFloat(document.getElementById('wpLng').value),
                    portata: document.getElementById('wpPortata').value,
                    foto: compressedDataUrl
                };

                await addDoc(collection(db, "waterPoints"), newWp);
                alert("Punto idrico salvato!");
                loadCloudData();
            } catch (err) {
                console.error("Errore punto idrico:", err);
            }
        }

        window.deleteWaterPoint = async function(id) {
            if (confirm("Sei sicuro di voler eliminare questo punto idrico?")) {
                try {
                    await deleteDoc(doc(db, "waterPoints", id));
                    loadCloudData();
                } catch (err) {
                    console.error("Errore eliminazione:", err);
                }
            }
        }

        // --- SEZIONE ARCHIVIO REPORT MENSILI (RISERVATA AI RESPONSABILI / CREATORE) ---
        window.renderArchivioReport = function() {
            if (!isManagerRole()) {
                document.getElementById('appContainer').innerHTML = `<div class="alert alert-danger">Accesso non autorizzato. Area riservata ai Responsabili.</div>`;
                return;
            }

            const canUpload = isAppCreator();

            let reportsHTML = uploadedReports.map((rep) => `
                <div class="col-md-6 mb-3">
                    <div class="card p-3 border-start border-4 border-info h-100">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="fw-bold text-primary mb-0"><i class="bi bi-file-earmark-text me-1"></i>${rep.titolo}</h5>
                            <small class="text-muted">${rep.dataCaricamento}</small>
                        </div>
                        <p class="mb-1"><strong>Periodo Riferimento:</strong> ${rep.periodo}</p>
                        <p class="mb-2 text-dark small">${rep.descrizione || 'Nessuna descrizione'}</p>
                        <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                            <a href="${rep.fileUrl}" download="${rep.fileName || 'report.doc'}" class="btn btn-sm btn-pc fw-bold">
                                <i class="bi bi-download me-1"></i> Scarica Report (.doc)
                            </a>
                            ${canUpload ? `
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteReport('${rep.id}')">
                                    <i class="bi bi-trash"></i> Elimina
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('tabContent').innerHTML = `
                <div class="mb-3">
                    <button class="btn btn-outline-secondary btn-sm" onclick="switchTab('bacheca')">
                        <i class="bi bi-arrow-left me-1"></i> Torna alla Bacheca
                    </button>
                </div>

                ${canUpload ? `
                <div class="card p-4 mb-4 bg-light border">
                    <h4 class="fw-bold text-primary mb-3"><i class="bi bi-cloud-arrow-up me-2"></i>Carica Nuovo Report Mensile Ufficiale (Creatore App)</h4>
                    <form onsubmit="uploadReportFile(event)">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Titolo del Report*</label>
                                <input type="text" id="repTitolo" class="form-control" placeholder="es. Report Operativo Ottobre 2026" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Mese e Anno di Riferimento (es. 10/2026)*</label>
                                <input type="text" id="repPeriodo" class="form-control" placeholder="MM/AAAA" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Seleziona File del Report (.doc / Word)*</label>
                            <input type="file" id="repFile" accept=".doc,.docx,application/msword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Note / Descrizione sintetica</label>
                            <textarea id="repDesc" class="form-control" rows="2" placeholder="Eventuali annotazioni sul report caricato..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-success fw-bold"><i class="bi bi-upload me-1"></i>Carica e Pubblica in Archivio</button>
                    </form>
                </div>
                ` : `
                <div class="alert alert-info mb-4">
                    <i class="bi bi-info-circle me-2"></i>Stai visualizzando l'archivio protetto dei report mensili in consultazione (Accesso consentito ai Responsabili). Il caricamento di nuovi file è riservato al Creatore App.
                </div>
                `}

                <h4 class="fw-bold mb-3"><i class="bi bi-folder2-open me-2"></i>Archivio Storico Report Mensili (${uploadedReports.length})</h4>
                <div class="row">${uploadedReports.length > 0 ? reportsHTML : '<div class="col-12 text-muted">Nessun report mensile archiviato al momento.</div>'}</div>
            `;
        }

        window.uploadReportFile = async function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('repFile');
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(event) {
                const base64File = event.target.result;
                const newReport = {
                    titolo: document.getElementById('repTitolo').value,
                    periodo: document.getElementById('repPeriodo').value,
                    descrizione: document.getElementById('repDesc').value,
                    fileName: file.name,
                    fileUrl: base64File,
                    dataCaricamento: new Date().toLocaleDateString('it-IT'),
                    caricatoDa: `${loggedUser.nome} ${loggedUser.cognome}`
                };

                try {
                    await addDoc(collection(db, "uploadedReports"), newReport);
                    alert("Report caricato e salvato nell'archivio cloud con successo!");
                    loadCloudData();
                } catch (err) {
                    console.error("Errore caricamento report:", err);
                    alert("Errore durante il salvataggio del report.");
                }
            };
            reader.readAsDataURL(file);
        }

        window.deleteReport = async function(id) {
            if (confirm("Sei sicuro di voler eliminare questo report dall'archivio?")) {
                try {
                    await deleteDoc(doc(db, "uploadedReports", id));
                    loadCloudData();
                } catch (err) {
                    console.error("Errore eliminazione report:", err);
                }
            }
        }

        // Avvio caricamento dati da Firebase all'apertura
        loadCloudData();
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
